name: Feature request
description: Suggest a reusable widget or template improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What desktop setup or workflow would this improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest reusable change that would solve it.
    validations:
      required: true
