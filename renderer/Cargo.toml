[package]
name = "desktop-tui"
version = "0.2.0"
edition = "2021"
description = "Transparent Ratatui desktop widgets for KDE Plasma 6"
repository = "https://github.com/vynxc/desktop-tui"
license = "MIT"
rust-version = "1.88"

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-backend-writer"] }
ratatui-3dmesh = { path = "../vendor/ratatui-3dmesh", default-features = false, features = ["gltf", "textures"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
